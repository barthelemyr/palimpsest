<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palimpsest — world history, layer by layer</title>
<meta name="description" content="Palimpsest: an interactive atlas of world history in layers — borders, peoples and population over 5,000 years, with the source of every layer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Archivo+Narrow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #fbfaf6;
  --ink: #1d1d1b;
  --ink-2: #55534e;
  --hair: #e4e1d8;
  --accent: #2f7fc1;
  --hdr: 52px;
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; display: block; }
#stage.dragging { cursor: grabbing; }

.bar { position: fixed; top: 0; left: 0; right: 0; height: var(--hdr); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; background: rgba(251,250,246,.94); border-bottom: 1px solid var(--hair); z-index: 10; backdrop-filter: blur(6px); }
.bar h1 a { color: inherit; text-decoration: none; cursor: pointer; border-radius: 6px; }
.bar h1 a:hover { opacity: .75; }
.bar h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
.bar .sub { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .sp { flex: 1; }
.ibtn { border: 1px solid var(--hair); background: #fff; border-radius: 999px; height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
.ibtn:hover { border-color: var(--ink); }
.ibtn svg { width: 16px; height: 16px; }

.zoomer { position: fixed; right: 14px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; z-index: 9; }
.zoomer button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--hair); background: #fff; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(29,29,27,.12); display: grid; place-items: center; }
.zoomer button svg { width: 18px; height: 18px; }
.zoomer .fsz { display: none; }
@media (max-width: 760px) { .zoomer .fsz { display: grid; } .bar .fsbtn { display: none; } }
.nofs .fsbtn, .nofs .fsz { display: none !important; }
.hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 999px; z-index: 9; pointer-events: none; transition: opacity .5s; white-space: nowrap; }
.hint.gone { opacity: 0; }
@media (max-width: 760px) { .hint { white-space: normal; text-align: center; max-width: calc(100vw - 40px); bottom: 62px; } }

#mapcv { position: fixed; inset: 0; touch-action: none; display: none; cursor: grab; }
body.map-mode #mapcv { display: block; }
body.map-mode #stage, body.map-mode .hint { display: none; }
#netcv { position: fixed; inset: 0; touch-action: none; display: none; cursor: grab; }
body.net-mode #netcv { display: block; } body.net-mode #mapcv { display: none; }
body.net-mode .timebar .credit { display: none !important; }
.bar h1 .lg { display: none; }
@media (max-width: 385px) { .bar h1 .nm { display: none; } .bar h1 .lg { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: #fff; font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 700; letter-spacing: 0; } }
@media (max-width: 440px) { .bar h1 .of { display: none; } #about { display: none; } .bar { gap: 5px; padding: 0 7px 0 9px; } .bar h1 { font-size: 13px !important; letter-spacing: -0.045em; } .seg button { padding: 5px 4px; font-size: 11.5px; } .bar { gap: 4px !important; } #explore { padding: 0 8px; } .seg { padding: 2px; } .ibtn { padding: 0 9px; } }
.story li.now { background: #f3f1ea; margin: 0 -8px; padding: 7px 8px; border-radius: 8px; }
.kt input[type=range] { flex: 1; accent-color: #1d1d1b; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 999px; background: #fff; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.timebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: none; align-items: center; gap: 10px; padding: 10px 16px 12px; background: rgba(251,250,246,.96); border-top: 1px solid var(--hair); backdrop-filter: blur(6px); }
body.map-mode .timebar { display: flex; }
.timebar .yr { font-weight: 900; font-size: 34px; letter-spacing: -0.03em; min-width: 150px; font-variant-numeric: tabular-nums; line-height: 1; }
.timebar .yr small { font-size: 15px; font-weight: 700; margin-left: 5px; color: var(--ink-2); letter-spacing: 0; }
.timebar input[type=range] { flex: 1; accent-color: #1d1d1b; height: 28px; min-width: 0; }
.tb { border: 1px solid var(--hair); background: #fff; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; font-weight: 700; cursor: pointer; flex: none; }
#play { background: var(--ink); color: #fff; border-color: var(--ink); width: 44px; height: 44px; font-size: 14px; }
.timebar .credit { position: absolute; left: 16px; bottom: calc(100% + 6px); font-size: 11px; color: var(--ink-2); background: rgba(251,250,246,.9); padding: 2px 6px; border-radius: 4px; }
.timebar .credit a { color: inherit; }
.ticks { position: absolute; left: 0; right: 0; top: 2px; height: 10px; pointer-events: none; }
body.map-mode .zoomer { bottom: 96px; }
@media (max-width: 760px) {
  .timebar { flex-wrap: wrap; padding: 8px 12px 12px; gap: 6px 8px; }
  .timebar .yr { font-size: 28px; min-width: 0; flex: 1; }
  .timebar input[type=range] { order: 5; flex-basis: 100%; }
  body.map-mode .zoomer { bottom: 124px; }
  .seg button { padding: 6px 9px; font-size: 13px; }
  .bar h1 { font-size: 17px !important; }
}
.keybar { position: fixed; left: 60px; bottom: 18px; z-index: 9; display: flex; gap: 8px; flex-wrap: wrap; }
body.map-mode .keybar { left: 12px; bottom: auto; top: calc(var(--hdr) + 10px); }
.kchip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--hair); background: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(29,29,27,.10); white-space: nowrap; }
.kchip:hover { border-color: var(--ink); }
.kchip svg { width: 16px; height: 16px; }
.kchip[aria-pressed="true"], .kchip[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.kchip.mapon { display: none; } body.map-mode .kchip.mapon { display: inline-flex; }
.geoctl { display: inline-flex; align-items: center; height: 36px; border-radius: 999px; border: 1px solid var(--hair); background: #fff; box-shadow: 0 2px 8px rgba(29,29,27,.10); font-size: 13px; font-weight: 700; }
.geoctl button { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; font-weight: 700; cursor: pointer; }
.geoctl button:disabled { opacity: .3; cursor: default; } .geoctl button:not(:disabled):hover { background: #f1eee6; }
.geoctl span { min-width: 92px; text-align: center; white-space: nowrap; padding: 0 2px; }
body.map-mode .postonly { display: none; }
.kdots { display: inline-flex; } .kdots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; margin-left: -3px; }
.kdots i:nth-child(1) { background: #d64533; margin-left: 0; } .kdots i:nth-child(2) { background: #8a5bb5; } .kdots i:nth-child(3) { background: #23968a; }
.keycard { position: fixed; left: 60px; bottom: 62px; z-index: 12; width: min(330px, calc(100vw - 72px)); max-height: min(62vh, 520px); overflow: auto; background: #fff; border: 1px solid var(--hair); border-radius: 14px; box-shadow: 0 8px 30px rgba(29,29,27,.16); padding: 12px 14px 12px; font-size: 13.5px; }
.keycard[hidden] { display: none; }
body.map-mode .keycard { left: 12px; bottom: auto; top: calc(var(--hdr) + 54px); }
.kseg { display: flex; border: 1px solid var(--hair); border-radius: 999px; padding: 3px; margin-bottom: 10px; }
.kseg button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 6px 6px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
.kseg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.kp { margin: 6px 0; line-height: 1.45; color: var(--ink); }
.kp.dim { color: var(--ink-2); font-size: 12.5px; }
.klist { display: flex; flex-direction: column; gap: 1px; margin: 6px 0; }
.kitem { display: flex; align-items: center; gap: 9px; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 8px; cursor: pointer; font-size: 13.5px; line-height: 1.25; }
button.kitem:hover { background: #f3f1ea; } .kitem.on, button.kitem.on:hover { background: #1d1d1b; color: #fff; }
.kitem.static { cursor: default; }
.kitem i { flex: none; width: 16px; height: 16px; border-radius: 4px; }
.kitem i.kout { background: #f3c9c2; box-shadow: inset 0 0 0 2.5px #7a2318; }
.kitem i.kdash { background: none; border: 1.5px dashed #444; }
.heretoday { margin: 6px 0 2px; font-size: 13px; color: #4a4843; }
.bridge { margin: 6px 0 2px; font-size: 13px; color: #4a4843; line-height: 1.45; }
.kitem i.ktoday { background: none; border-top: 2px dashed #1d1d1b; border-radius: 0; height: 2px; margin: 7px 0; }
.kt { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hair); cursor: pointer; }
@media (max-width: 760px) {
  .keybar { left: 54px; bottom: 14px; }
  .keycard { left: 10px; right: 10px; width: auto; bottom: 60px; max-height: 48vh; }
  .hint { bottom: 62px; }
  body.map-mode .keycard { left: 10px; right: 10px; }
  body.map-mode .keybar { right: 0; left: 0; padding: 2px 10px 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  body.map-mode .keybar::-webkit-scrollbar { display: none; }
  body.map-mode .keybar > * { flex: none; }
  .kchip { height: 34px; padding: 0 11px; font-size: 13px; } .geoctl { height: 34px; } .geoctl span { min-width: 80px; font-size: 12px; }
}
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: #fff; padding: 6px 9px; border-radius: 6px; font-size: 12.5px; line-height: 1.3; max-width: 280px; display: none; }
.tip small { display: block; color: #cfcbc2; font-size: 11.5px; }

/* sheet: right drawer on wide screens, bottom sheet on phones */
.sheet { position: fixed; z-index: 15; background: #fff; display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(29,29,27,.18); }
.sheet[hidden] { display: none; }
@media (min-width: 761px) { .sheet { top: calc(var(--hdr) + 10px); right: 10px; bottom: 10px; width: 400px; border-radius: 14px; } .grab { display: none; } }
@media (max-width: 760px) {
  .sheet { left: 0; right: 0; bottom: 0; height: 62vh; border-radius: 16px 16px 0 0; transition: height .22s ease; }
  .sheet.full { height: calc(100vh - var(--hdr) - 6px); height: calc(100dvh - var(--hdr) - 6px); }
  .grab { flex: none; height: 18px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .grab::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: #d6d2c8; }
  .bar .sub { display: none; }
  .bar h1 { font-size: 19px; }
  .ibtn .lbl { display: none; }
  .ibtn { padding: 0 11px; }
  .zoomer { bottom: 14px; right: 10px; }
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 2px; flex: none; }
.sheet-head .sp { flex: 1; }
.back { border: 0; background: #f1efe9; height: 32px; border-radius: 999px; padding: 0 12px 0 9px; cursor: pointer; font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.back[hidden] { display: none; }
.sheet-body { overflow: auto; padding: 2px 20px 28px; min-height: 0; flex: 1; overscroll-behavior: contain; }
/* panel building blocks */
.kick { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; text-transform: none; }
.kick .lk { font-size: 12.5px; }
.ttl { display: flex; align-items: flex-start; gap: 10px; margin: 4px 0 2px; }
.ttl .sw { flex: none; width: 14px; height: 14px; border-radius: 4px; margin-top: 7px; box-shadow: inset 0 0 0 1px rgba(29,29,27,.12); }
.sheet .ttl h2 { margin: 0; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: #f1efe9; color: #4a4843; white-space: nowrap; }
.wmini { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; padding: 1px 6px; border-radius: 999px; background: #e6eefa; color: #24508f; font-size: 11px; font-weight: 700; text-decoration: none; vertical-align: 1px; white-space: nowrap; }
.wmini:hover { background: #d6e3f7; } .wmini b { font-family: Georgia, "Times New Roman", serif; font-size: 11.5px; }
.badge.wiki { background: #e6eefa; color: #24508f; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.badge.wiki:hover { background: #d6e3f7; }
.badge.wiki b { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 12.5px; line-height: 1; }
.badge.wiki span { font-size: 11px; opacity: .8; }
.facts dd .dim { font-weight: 500; font-size: 13px; }
.badge.comp { background: #e6edf3; color: #2f4f6b; } .badge.approx { background: #fff; color: #7a5a17; box-shadow: inset 0 0 0 1px #e2c98f; } .badge[title] { cursor: help; }
.badge.ok { background: #e3f2e6; color: #2e6b3f; } .badge.warn { background: #fbf0dc; color: #7a5a17; } .badge.dark { background: var(--ink); color: #fff; }
.lead { font-size: 15.5px; line-height: 1.5; margin: 10px 0 4px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; margin: 12px 0 6px; }
.facts > div { background: #fff; padding: 8px 10px; min-width: 0; }
.facts > div.wide { grid-column: 1 / -1; }
.facts dt { font-size: 11.5px; color: var(--ink-2); margin: 0 0 2px; }
.facts dd { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.facts dd .lk { font-weight: 700; }
.viz { margin: 14px 0 4px; }
.viz .vh { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.strip { position: relative; height: 26px; border-radius: 6px; background: #f3f1ea; overflow: hidden; }
.strip .sg { position: absolute; top: 0; bottom: 0; border: 0; padding: 0; cursor: pointer; box-shadow: inset -1px 0 0 #fff; }
.strip .sg:hover { filter: brightness(.93); }
.strip .sg.on { box-shadow: inset 0 0 0 2.5px var(--ink); z-index: 1; }
.strip .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); pointer-events: none; z-index: 2; }
.ticks2 { position: relative; height: 14px; font-size: 10.5px; color: var(--ink-2); margin-top: 3px; }
.ticks2 span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks2 span:first-child { transform: none; } .ticks2 span:last-child { transform: translateX(-100%); }
.spark { display: block; width: 100%; height: 64px; cursor: crosshair; background: #f7f5ef; border-radius: 8px; }
details.sec { border-top: 1px solid var(--hair); margin-top: 10px; }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 0 8px; font-weight: 800; font-size: 14px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid #8a867c; border-bottom: 2px solid #8a867c; transform: rotate(45deg); transition: transform .15s; }
details.sec[open] > summary::after { transform: rotate(-135deg); }
details.sec .cnt { font-weight: 700; font-size: 12px; color: var(--ink-2); background: #f1efe9; border-radius: 999px; padding: 1px 7px; }
details.sec ul { margin-top: 0; }
/* Before and after (successions) */
.sbadge { margin: 0 0 4px; }
h4.sh { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 8px 0 2px; }
.srows { display: grid; gap: 1px; margin: 0 0 4px; }
.srow { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; width: calc(100% + 16px); margin: 0 -8px; padding: 5px 8px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.srow:hover, .srow:focus-visible { background: #f4f2ec; }
.srow b { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.srow .dim { font-size: 12px; }
.srow[hidden] { display: none; }
.smore { margin: 4px 0 2px; font-size: 13px; font-weight: 700; }
.chipl { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.cbtn { border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.cbtn:hover { border-color: var(--ink); }
.cbtn i { width: 10px; height: 10px; border-radius: 3px; }
.lensh { width: 100%; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #8a867c; margin-bottom: -2px; }
.lens { display: flex; gap: 5px; width: 100%; }
.lens .lb { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--hair); background: #fff; border-radius: 10px; padding: 6px 2px 5px; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--ink); }
.lens .lb svg { width: 18px; height: 18px; }
.lens .lb.on { background: var(--ink); color: #fff; border-color: var(--ink); cursor: default; }
.lens .lb:disabled { opacity: .32; cursor: default; }
.lens .lb:not(.on):not(:disabled):hover { border-color: var(--ink); }
.acts .ex { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.fchip { display: inline-flex; align-items: center; min-width: 0; max-width: min(440px, 38vw); height: 32px; border: 1px solid var(--hair); background: #fff; border-radius: 999px; padding: 0 4px 0 10px; gap: 6px; font-size: 13px; font-weight: 700; }
.fchip[hidden] { display: none !important; }
.fchip .fl { border: 0; background: none; display: inline-flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer; font: inherit; padding: 0; color: inherit; }
.fchip .fl span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fchip .fl em { font-style: normal; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.fchip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(29,29,27,.15); }
.fchip .fl svg { width: 14px; height: 14px; flex: none; }
.fchip .fl .flag { margin-right: 0; }
.fchip .fx { border: 0; background: #f1efe9; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex: none; font-size: 15px; line-height: 1; }
.fchip .fx:hover { background: #e6e2d8; }
body.has-focus .bar .sub { display: none; }
#fchip2 { display: none; }
@keyframes lensin { from { opacity: 0; } to { opacity: 1; } }
.lensin { animation: lensin .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .lensin { animation: none; } }
@media (max-width: 760px) { .bar .fchip { display: none !important; } #fchip2:not([hidden]) { display: inline-flex; max-width: 64vw; height: 34px; box-shadow: 0 2px 8px rgba(29,29,27,.10); } }
.acts { position: sticky; bottom: -28px; margin: 18px -20px -28px; padding: 10px 20px 14px; background: linear-gradient(rgba(255,255,255,.85), #fff 30%); display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--hair); }
.act { border: 1px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.act.pri { background: var(--ink); color: #fff; }
.act svg { width: 15px; height: 15px; }
.srcs p { font-size: 13.5px; }
/* full screen and option chips */
.fsbtn svg { width: 16px; height: 16px; }
.maponly, .netonly { display: none !important; }
body.map-mode .maponly { display: inline-flex !important; }
body.net-mode .netonly { display: inline-flex !important; }
.menu { position: fixed; z-index: 12; left: 12px; top: calc(var(--hdr) + 54px); width: min(280px, calc(100vw - 24px)); background: #fff; border: 1px solid var(--hair); border-radius: 14px; box-shadow: 0 8px 30px rgba(29,29,27,.16); padding: 8px; }
